<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic DOM Manipulation</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --reset: #4b5563;
            --reset-hover: #374151;
            --card-bg: #ffffff;
            --body-bg: #f3f4f6;
            --text-main: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            transition: color 0.3s ease;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 24px 0;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.remove-btn {
            background-color: var(--danger);
        }

        button.remove-btn:hover {
            background-color: var(--danger-hover);
        }

        button.reset-btn {
            background-color: var(--reset);
        }

        button.reset-btn:hover {
            background-color: var(--reset-hover);
        }

        .element-display {
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Target Elements -->
        <h1 id="main-heading">Original Heading Text</h1>
        <p id="main-paragraph">This is the original paragraph content. Use the controls below to alter this page dynamically.</p>

        <!-- Controls -->
        <div class="controls">
            <button onclick="changeText()">Change Text</button>
            <button onclick="changeTextColor()">Change Text Color</button>
            <button onclick="changeBackgroundColor()">Change Background</button>
            <button onclick="addElement()">Add List Item</button>
            <button class="remove-btn" onclick="removeElement()">Remove Last Item</button>
            <button class="reset-btn" onclick="resetPage()">Reset All</button>
        </div>

        <!-- Dynamic List Container -->
        <div class="element-display">
            <h3>Dynamic Element List</h3>
            <ul id="dynamic-list">
                <li>Default Item 1</li>
            </ul>
        </div>
    </div>

    <script>
        // Store default states for the dynamic reset function
        const defaultHeading = "Original Heading Text";
        const defaultParagraph = "This is the original paragraph content. Use the controls below to alter this page dynamically.";
        const defaultTextColor = "#1f2937";
        const defaultBgColor = "#f3f4f6";

        let itemCount = 1;

        // 1. Change Text Content
        function changeText() {
            const heading = document.getElementById("main-heading");
            const paragraph = document.getElementById("main-paragraph");

            heading.textContent = "DOM Updated Successfully!";
            paragraph.textContent = "The text has been dynamically replaced via the JavaScript textContent property.";
        }

        // 2. Modify Text Color
        function changeTextColor() {
            const heading = document.getElementById("main-heading");
            const paragraph = document.getElementById("main-paragraph");

            const colors = ["#2563eb", "#059669", "#7c3aed", "#d97706", "#db2777"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            heading.style.color = randomColor;
            paragraph.style.color = randomColor;
        }

        // 3. Change Background Color
        function changeBackgroundColor() {
            const backgrounds = ["#eef2ff", "#ecfdf5", "#fef3c7", "#fff1f2", "#f5f3ff"];
            const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];

            document.body.style.backgroundColor = randomBg;
        }

        // 4. Add Elements Dynamically
        function addElement() {
            itemCount++;
            const list = document.getElementById("dynamic-list");

            // Create a new <li> node
            const newItem = document.createElement("li");
            newItem.textContent = `Dynamically Added Item ${itemCount}`;

            // Append child to the parent container
            list.appendChild(newItem);
        }

        // 5. Remove Elements Dynamically
        function removeElement() {
            const list = document.getElementById("dynamic-list");

            // Verify a child exists before attempting removal
            if (list.lastElementChild) {
                list.removeChild(list.lastElementChild);
                if (itemCount > 0) itemCount--;
            } else {
                alert("No elements left to remove!");
            }
        }

        // 6. Reset Webpage Dynamically (No reload)
        function resetPage() {
            const heading = document.getElementById("main-heading");
            const paragraph = document.getElementById("main-paragraph");
            const list = document.getElementById("dynamic-list");

            // Reset text content
            heading.textContent = defaultHeading;
            paragraph.textContent = defaultParagraph;

            // Reset inline styles
            heading.style.color = defaultTextColor;
            paragraph.style.color = defaultTextColor;
            document.body.style.backgroundColor = defaultBgColor;

            // Reset dynamic list back to default single item
            list.innerHTML = "";
            const initialItem = document.createElement("li");
            initialItem.textContent = "Default Item 1";
            list.appendChild(initialItem);
            itemCount = 1;
        }
    </script>
</body>
</html>
